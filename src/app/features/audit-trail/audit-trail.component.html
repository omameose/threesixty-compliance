<app-page-header title="Audit Trail" subtitle="Who did what, when, to which record, and why — a permanent, read-only record. No one can silently delete compliance evidence.">
  <button class="btn-secondary" (click)="exportCsv()"><app-icon name="download" [size]="16"></app-icon> Export CSV</button>
</app-page-header>

<div class="relative max-w-sm mb-5">
  <app-icon name="search" [size]="16" class="absolute left-3 top-1/2 -translate-y-1/2 text-ink-400"></app-icon>
  <input class="input pl-9" placeholder="Search by actor, action or entity..." [(ngModel)]="query"/>
</div>

<div class="card overflow-x-auto" *ngIf="!loading">
  <table class="table">
    <thead><tr><th>Timestamp</th><th>Actor</th><th>Action</th><th>Entity</th><th>Before / After</th><th>IP Address</th><th>Detail</th></tr></thead>
    <tbody>
      <tr *ngFor="let e of filtered()">
        <td class="text-sm text-ink-500 whitespace-nowrap">{{ e.timestamp }}</td>
        <td class="font-medium text-ink-900">{{ e.actor }}</td>
        <td class="text-sm text-ink-700">{{ e.action }}</td>
        <td class="text-sm text-ink-600"><span class="badge-gray">{{ e.entityType }}</span> <span class="font-mono text-xs">{{ e.entityId }}</span></td>
        <td class="text-xs">
          <div class="flex items-center gap-1.5" *ngIf="e.oldValue || e.newValue">
            <span class="px-1.5 py-0.5 rounded bg-red-50 text-red-600 line-through">{{ e.oldValue }}</span>
            <app-icon name="arrow-right" [size]="11" class="text-ink-300"></app-icon>
            <span class="px-1.5 py-0.5 rounded bg-brand-50 text-brand-700">{{ e.newValue }}</span>
          </div>
          <span class="text-ink-300" *ngIf="!e.oldValue && !e.newValue">—</span>
        </td>
        <td class="text-xs text-ink-400 font-mono">{{ e.ipAddress }}</td>
        <td class="text-sm text-ink-600 max-w-sm">{{ e.detail }}</td>
      </tr>
    </tbody>
  </table>
</div>

<div *ngIf="loading" class="flex items-center justify-center py-24 text-ink-400">Loading audit log...</div>
