<app-page-header title="Alert Management" subtitle="Every detection produces a prioritised alert — triage, escalate, or convert straight into a case.">
</app-page-header>

<div class="fixed bottom-6 right-6 z-40 bg-ink-900 text-white text-sm px-4 py-3 rounded-lg shadow-lg max-w-sm fade-in" *ngIf="toastMessage()">
  {{ toastMessage() }}
</div>

<div class="flex items-center gap-1 bg-ink-100 rounded-lg p-1 w-fit mb-5 overflow-x-auto">
  <button class="px-3 py-1.5 rounded-md text-sm font-medium whitespace-nowrap" [class.bg-white]="statusFilter === 'all'" [class.shadow-sm]="statusFilter === 'all'" (click)="statusFilter = 'all'">All</button>
  <button class="px-3 py-1.5 rounded-md text-sm font-medium whitespace-nowrap" [class.bg-white]="statusFilter === 'open'" [class.shadow-sm]="statusFilter === 'open'" (click)="statusFilter = 'open'">Open</button>
  <button class="px-3 py-1.5 rounded-md text-sm font-medium whitespace-nowrap" [class.bg-white]="statusFilter === 'assigned'" [class.shadow-sm]="statusFilter === 'assigned'" (click)="statusFilter = 'assigned'">Assigned</button>
  <button class="px-3 py-1.5 rounded-md text-sm font-medium whitespace-nowrap" [class.bg-white]="statusFilter === 'investigating'" [class.shadow-sm]="statusFilter === 'investigating'" (click)="statusFilter = 'investigating'">Investigating</button>
  <button class="px-3 py-1.5 rounded-md text-sm font-medium whitespace-nowrap" [class.bg-white]="statusFilter === 'escalated'" [class.shadow-sm]="statusFilter === 'escalated'" (click)="statusFilter = 'escalated'">Escalated</button>
  <button class="px-3 py-1.5 rounded-md text-sm font-medium whitespace-nowrap" [class.bg-white]="statusFilter === 'closed'" [class.shadow-sm]="statusFilter === 'closed'" (click)="statusFilter = 'closed'">Closed</button>
</div>

<div class="card overflow-x-auto" *ngIf="!loading && filtered().length">
  <table class="table">
    <thead><tr><th>Customer</th><th>Type</th><th>Rule Triggered</th><th>Severity</th><th>Risk Score</th><th>Status</th><th>Assigned</th><th></th></tr></thead>
    <tbody>
      <tr *ngFor="let a of filtered()">
        <td>
          <div class="flex items-center gap-3">
            <app-avatar [name]="a.customerName" [size]="30"></app-avatar>
            <a [routerLink]="['/app/my-clients', a.customerId]" class="font-medium text-ink-900 hover:text-brand-600">{{ a.customerName }}</a>
          </div>
        </td>
        <td><span class="badge-blue">{{ a.type }}</span></td>
        <td class="text-sm text-ink-600 max-w-xs">{{ a.ruleTriggered }}</td>
        <td><span [ngClass]="severityBadge(a.severity)">{{ a.severity }}</span></td>
        <td class="font-medium text-ink-800">{{ a.riskScore }}</td>
        <td><span [ngClass]="statusBadge(a.status)">{{ a.status.replace('_',' ') }}</span></td>
        <td class="text-sm text-ink-600">{{ a.assignedTo || '—' }}</td>
        <td>
          <div class="flex items-center justify-end gap-1 flex-wrap">
            <button class="btn-secondary btn-sm" *ngIf="a.status === 'open'" (click)="assignToMe(a)">Assign to me</button>
            <button class="btn-secondary btn-sm" *ngIf="a.status !== 'escalated' && a.status !== 'closed'" (click)="escalate(a)">Escalate</button>
            <button class="btn-primary btn-sm" *ngIf="!a.caseId && a.status !== 'closed'" (click)="convertToCase(a)">Open Case</button>
            <a *ngIf="a.caseId" [routerLink]="['/app/cases', a.caseId]" class="btn-secondary btn-sm">View Case</a>
            <button class="p-2 text-ink-400 hover:text-red-500" title="Close alert" *ngIf="a.status !== 'closed'" (click)="close(a)">
              <app-icon name="x-circle" [size]="16"></app-icon>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="card" *ngIf="!loading && !filtered().length">
  <app-empty-state icon="bell" title="No alerts in this view" subtitle="Try a different filter — new alerts will appear here as they're detected."></app-empty-state>
</div>

<div *ngIf="loading" class="flex items-center justify-center py-24 text-ink-400">Loading alerts...</div>
