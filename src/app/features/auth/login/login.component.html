<app-auth-shell headline="Welcome back to your compliance dashboard." sub="Sign in to review submissions, manage forms and monitor your compliance program.">
  <h1 class="text-2xl font-bold text-ink-950 mb-1">Sign in</h1>
  <p class="muted mb-7">Enter your credentials to access your dashboard.</p>

  <div *ngIf="error" class="mb-4 p-3 rounded-lg bg-red-50 text-red-700 text-sm" role="alert">{{ error }}</div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4" novalidate>
    <div>
      <label class="label" for="email">Work email</label>
      <input id="email" class="input" type="email" formControlName="email" placeholder="you@company.com" autocomplete="username"/>
      <p class="text-xs text-red-600 mt-1" *ngIf="form.controls.email.touched && form.controls.email.invalid">Enter a valid email address.</p>
    </div>
    <div>
      <div class="flex items-center justify-between mb-1.5">
        <label class="label !mb-0" for="password">Password</label>
        <a routerLink="/auth/forgot-password" class="text-xs font-medium text-brand-600 hover:underline">Forgot password?</a>
      </div>
      <div class="relative">
        <input id="password" class="input pr-10" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Enter your password" autocomplete="current-password"/>
        <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-400" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
          <app-icon name="eye" [size]="18"></app-icon>
        </button>
      </div>
      <p class="text-xs text-red-600 mt-1" *ngIf="form.controls.password.touched && form.controls.password.invalid">Enter your password.</p>
    </div>

    <button type="submit" class="btn-primary w-full py-3" [disabled]="loading">
      <span *ngIf="!loading">Sign in</span>
      <span *ngIf="loading">Signing in...</span>
    </button>
  </form>

  <p class="text-center text-sm text-ink-500 mt-6">
    Don't have an account? <a routerLink="/auth/register" class="text-brand-600 font-medium hover:underline">Create one</a>
  </p>
</app-auth-shell>
